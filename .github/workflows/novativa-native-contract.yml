name: Novativa native Editor contract

on:
  pull_request:
    branches: [develop]
    paths:
      - 'src/novativa/**'
      - 'src/editor/**'
      - 'src/editor-api/**'
      - 'vite.config.mjs'
      - 'package-lock.json'
      - 'sass/**'
      - 'test/novativa-*.test.mjs'
      - 'docs/novativa-native-editor-backend-v1.md'
      - '.github/workflows/novativa-native-contract.yml'
  push:
    branches: [develop]
    paths:
      - 'src/novativa/**'
      - 'src/editor/**'
      - 'src/editor-api/**'
      - 'vite.config.mjs'
      - 'package-lock.json'
      - 'sass/**'
      - 'test/novativa-*.test.mjs'
      - 'docs/novativa-native-editor-backend-v1.md'
      - '.github/workflows/novativa-native-contract.yml'

permissions:
  contents: read

jobs:
  bootstrap-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/novativa/native-editor-bootstrap.mjs
      - run: node --check src/novativa/canonical-scene-projection.mjs
      - run: node --check src/novativa/native-hierarchy-client.mjs
      - run: node --check src/novativa/native-scene-snapshot.mjs
      - run: node --check src/novativa/native-scene-read-client.mjs
      - run: node --check src/novativa/native-runtime-contract.mjs
      - run: node --test test/novativa-native-bootstrap.test.mjs test/novativa-scene-projection.test.mjs test/novativa-native-hierarchy-client.test.mjs test/novativa-native-scene-snapshot.test.mjs test/novativa-native-scene-read-client.test.mjs test/novativa-native-runtime-contract.test.mjs
      - run: node --test test/novativa-native-read-only-runtime.test.mjs
      - name: Exercise the original ShareDB scene client
        run: |
          install_dir="$(mktemp -d)"
          npm install --prefix "$install_dir" --no-save --no-audit --no-fund tsx@4 mocha@11 chai@5 @playcanvas/observer@1.8.1 sharedb@3.3.2
          ln -s "$install_dir/node_modules" node_modules
          node --import tsx node_modules/mocha/bin/mocha.js --no-config --no-package test/editor-api/realtime/scene.test.ts

  build-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: test -s dist/js/editor.js && test -s dist/css/editor.css
      - name: Produce immutable DEV release inventory
        run: node scripts/novativa-native-artifact-manifest.mjs
      - name: Upload candidate bundle (no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: novativa-playcanvas-native-dev-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
